services:
  app:
    build: .
    container_name: car-charger-planner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: "Europe/Amsterdam"
      NODE_ENV: "production"
      DATABASE_URL: "file:/data/app.db?connection_limit=1"
      # Home Assistant connection. Not needed when running as an add-on (the Supervisor
      # token is used automatically); for standalone Docker, create a Long-Lived Access
      # Token in HA (profile -> Security). Both are also editable in the Settings UI.
      HA_BASE_URL: "${HA_BASE_URL:-}"
      HA_ACCESS_TOKEN: "${HA_ACCESS_TOKEN:-}"
    volumes:
      - charger-data:/data

volumes:
  charger-data:
